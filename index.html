<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#46178f">
<title>LeerKnal – oefen als een quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#46178f;--card:#fff;--ink:#1f1235;--soft:#efe8fb;--red:#e21b3c;--blue:#1368ce;--yellow:#ffc00a;--green:#26890c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:1.05rem}.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800;line-height:1;margin:.2em 0 .1em}.sub{opacity:.9}.card{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:12px 0 4px}textarea,input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--soft);background:var(--card);color:var(--ink)}textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:800;font-size:1.1rem;background:var(--yellow);color:#2b1a00;box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer;width:100%;margin-top:12px}.btn:disabled{opacity:.6;cursor:default}.btn.secondary{background:var(--soft);box-shadow:none}.menu{display:grid;gap:12px;margin-top:22px}.big{border:0;border-radius:14px;padding:18px 20px;color:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28)}.big b{font-size:1.4rem;display:block}.blue{background:var(--blue)}.purple{background:#864cbf}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}.pill{background:rgba(0,0,0,.28);border-radius:99px;padding:4px 14px}.bar{height:10px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:100%;background:var(--yellow)}.question{background:var(--card);color:var(--ink);border-radius:14px;padding:22px 18px;font-size:1.35rem;font-weight:700;text-align:center;line-height:1.25;min-height:100px;display:grid;place-items:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice{border:0;border-radius:12px;padding:16px 12px;min-height:75px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;text-align:left;cursor:pointer;background:var(--red)}.choice:nth-child(2){background:var(--blue)}.choice:nth-child(3){background:var(--yellow);color:#2b1a00}.choice:nth-child(4){background:var(--green)}.choice.right{outline:4px solid #fff}.choice.dim{opacity:.45}.choice:disabled{cursor:default}.feedback{border-radius:12px;padding:12px;margin-top:12px;text-align:center;font-weight:700;color:white}.correct{background:var(--green)}.incorrect{background:var(--red)}.score{font-size:3.5rem;font-weight:800;line-height:1}.error{color:var(--red);font-weight:700;min-height:1.4em}.small{font-size:.92rem;opacity:.85}@media(max-width:480px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body><main id="app" class="wrap"></main>
<script>
const app=document.getElementById('app'),$=id=>document.getElementById(id),STORE='leerknal.quizzes.v2';let timer=null,questions=[],qi=0,score=0,streak=0,best=0,startedAt=0,locked=false,seconds=20;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLocaleLowerCase('nl').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[out[i],out[j]]=[out[j],out[i]]}return out};
const words=s=>s.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’-]{4,}/g)||[];
const stop=new Set('de het een en van in op met voor door bij aan tot uit als dat die deze dit zijn was wordt werden worden heeft hebben kan kunnen moet moeten ook nog maar niet wel meer veel over tussen naar onder boven zoals waarbij omdat daardoor hiermee daarom wanneer tijdens terwijl ieder andere eerste tweede derde zelf vooral meestal bijvoorbeeld'.split(' '));
function saved(){try{return JSON.parse(localStorage.getItem(STORE))||[]}catch{return[]}}
function saveQuiz(quiz){try{localStorage.setItem(STORE,JSON.stringify([quiz,...saved()].slice(0,30)))}catch{}}
function home(){clearInterval(timer);app.innerHTML=`<h1>LeerKnal</h1><p class="sub">Maak zelf een quiz van je leerwijzer en cursus. Geen AI, account of externe AI-dienst nodig.</p><div class="menu"><button class="big blue" data-action="create"><b>📚 Quiz maken</b>Plak je leerwijzer en cursus; LeerKnal maakt invul- en meerkeuzevragen.</button><button class="big purple" data-action="saved"><b>💾 Mijn quizzen</b>Speel eerder gemaakte quizzen opnieuw.</button></div>`;}
function createScreen(){app.innerHTML=`<button class="btn secondary" data-action="home">← Menu</button><h1 style="font-size:2.2rem">Quiz maken</h1><div class="card"><p>De quiz wordt automatisch gemaakt uit de tekst die je hieronder invult. Woorden die belangrijk lijken in je leerwijzer krijgen extra aandacht. Dit is geen generatieve AI; controleer de vragen even voor je gaat oefenen.</p><label for="guide">Leerwijzer: wat moet je kennen?</label><textarea id="guide" placeholder="Plak hier je leerwijzer of de belangrijkste begrippen…"></textarea><label for="course">Cursus of samenvatting</label><textarea id="course" style="min-height:200px" placeholder="Plak hier de cursus of samenvatting. Gebruik volledige zinnen…"></textarea><div class="row"><div><label for="count">Aantal vragen (3–30)</label><input id="count" type="number" min="3" max="30" value="10"></div><div><label for="time">Tijd per vraag (5–120 sec.)</label><input id="time" type="number" min="5" max="120" value="20"></div></div><label for="quizname">Naam van de quiz (optioneel)</label><input id="quizname" maxlength="60" placeholder="Bijvoorbeeld: Biologie – hoofdstuk 3"><p id="error" class="error" aria-live="polite"></p><button class="btn" data-action="generate">Maak mijn quiz</button></div>`;}
function buildQuestions(course,guide,count){
  const sentences=course.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>=35&&s.length<=350);
  const guideWords=new Set(words(guide).map(w=>norm(w)).filter(w=>!stop.has(w)));
  const allWords=[...new Set(words(course).map(norm).filter(w=>!stop.has(w)))];
  const result=[],used=new Set();
  for(const sentence of shuffle(sentences)){
    const candidates=[...new Set(words(sentence).map(norm).filter(w=>!stop.has(w)&&w.length>=5))];
    candidates.sort((a,b)=>(Number(guideWords.has(b))-Number(guideWords.has(a)))+(b.length-a.length)*.03);
    let answer=null,index=-1;
    for(const word of candidates){const at=norm(sentence).indexOf(word);if(at>=0&&!/[A-Za-zÀ-ÿ]/.test(norm(sentence)[at-1]||'')&&!/[A-Za-zÀ-ÿ]/.test(norm(sentence)[at+word.length]||'')&&!used.has(word)){answer=word;index=at;break}}
    if(!answer)continue;
    let distractors=shuffle(allWords.filter(w=>w!==answer&&!norm(sentence).includes(w)&&!used.has(w)));
    const chosen=[];
    for(const w of distractors){if(!chosen.some(x=>x===w))chosen.push(w);if(chosen.length===3)break}
    if(chosen.length<3)continue;
    used.add(answer);const options=shuffle([answer,...chosen]);
    result.push({q:sentence.slice(0,index)+'_____'+sentence.slice(index+answer.length),o:options,a:options.indexOf(answer),e:'Gebaseerd op: '+sentence});
    if(result.length>=count)break;
  }
  return result;
}
function generate(){const course=$('course').value.trim(),guide=$('guide').value.trim(),count=Math.max(3,Math.min(30,Number.parseInt($('count').value,10)||10)),limit=Math.max(5,Math.min(120,Number.parseInt($('time').value,10)||20)),error=$('error');if(course.length<120){error.textContent='Plak meer cursustekst (minstens 120 tekens en enkele volledige zinnen).';return}const qs=buildQuestions(course,guide,count);if(qs.length<3){error.textContent='Ik kon geen drie bruikbare vragen maken. Voeg meer volledige zinnen en verschillende kernwoorden toe aan je cursus.';return}const quiz={id:Date.now(),name:$('quizname').value.trim()||'Mijn quiz – '+new Date().toLocaleDateString('nl-BE'),date:new Date().toLocaleDateString('nl-BE'),seconds:limit,questions:qs};saveQuiz(quiz);startQuiz(quiz);}
function startQuiz(quiz){questions=quiz.questions;seconds=Math.max(5,Math.min(120,Number(quiz.seconds)||20));qi=0;score=0;streak=0;best=0;renderQuestion();}
function renderQuestion(){clearInterval(timer);locked=false;const q=questions[qi];startedAt=Date.now();app.innerHTML=`<div class="top"><span class="pill">${qi+1} / ${questions.length}</span><span class="pill">🔥 ${streak}</span><span class="pill">${score} punten</span></div><div class="bar"><i id="timerbar"></i></div><div class="question">${esc(q.q)}</div><div class="choices">${q.o.map((o,i)=>`<button class="choice" data-choice="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div>`;app.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>answer(Number(button.dataset.choice),false));timer=setInterval(()=>{const fraction=1-(Date.now()-startedAt)/(seconds*1000),bar=$('timerbar');if(bar)bar.style.width=Math.max(0,fraction*100)+'%';if(fraction<=0)answer(-1,true)},100);}
function answer(choice,timedOut){if(locked)return;locked=true;clearInterval(timer);const q=questions[qi],ok=choice===q.a;let points=0;if(ok){streak++;best=Math.max(best,streak);points=Math.round(500+500*Math.max(0,1-(Date.now()-startedAt)/(seconds*1000)))+Math.min(streak-1,5)*50;score+=points}else streak=0;app.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===choice)b.classList.add('dim')});$('feedback').innerHTML=`<div class="feedback ${ok?'correct':'incorrect'}">${ok?`Goed! +${points} punten`:timedOut?'Tijd om!':'Helaas.'} ${!ok?`Het juiste antwoord: ${esc(q.o[q.a])}`:''}<small>${esc(q.e)}</small></div><button class="btn" id="next">${qi+1<questions.length?'Volgende vraag':'Bekijk resultaat'}</button>`;$('next').onclick=()=>{qi++;if(qi<questions.length)renderQuestion();else resultScreen()};}
function resultScreen(){clearInterval(timer);const correct=Math.round(questions.filter((_,i)=>false).length);app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">🏆</div><div class="score">${score}</div><p>punten · ${questions.length} vragen · ${seconds} seconden per vraag</p><p>Je langste goede reeks: ${best}</p><button class="btn" id="again">Quiz opnieuw spelen</button><button class="btn secondary" data-action="saved">Mijn quizzen</button><button class="btn secondary" data-action="home">Menu</button></div>`;$('again').onclick=()=>{qi=0;score=0;streak=0;best=0;renderQuestion()};}
function savedScreen(){const quizzes=saved();app.innerHTML=`<button class="btn secondary" data-action="home">← Menu</button><h1 style="font-size:2.2rem">Mijn quizzen</h1>`+(quizzes.length?quizzes.map(q=>`<div class="card"><b>${esc(q.name)}</b><br><span class="small">${q.questions.length} vragen · ${q.seconds} sec. per vraag · ${esc(q.date||'')}</span><button class="btn" data-play="${q.id}">Spelen</button><button class="btn secondary" data-delete="${q.id}">Verwijderen</button></div>`).join(''):'<div class="card">Je hebt nog geen quizzen opgeslagen.</div>');app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const quiz=saved().find(q=>String(q.id)===b.dataset.play);if(quiz)startQuiz(quiz)});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{localStorage.setItem(STORE,JSON.stringify(saved().filter(q=>String(q.id)!==b.dataset.delete)));savedScreen()});}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'home':home();break;case'create':createScreen();break;case'generate':generate();break;case'saved':savedScreen();break}});
home();
</script></body></html>
